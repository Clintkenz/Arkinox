name: Deploy to Harmon Web (FTP)

on:
  push:
    branches:
      - main # Change this to your primary branch name (e.g., master)

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    environment: Arkinox # Adding this line to match your GitHub setup
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: 🚀 Sync Files to Harmon Web
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_dir: ./dist/
          remote_dir: /public_html/
          ssh_private_key: '' # We'll use password instead
          # Harmon Web usually supports password auth for SFTP
