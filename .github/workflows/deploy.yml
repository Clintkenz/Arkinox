name: Deploy to Harmon Web (FTP)

on:
  push:
    branches:
      - main # Change this to your primary branch name (e.g., master)

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: 🚀 Sync Files to Harmon Web
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/ # Adjust this if your site is in a subfolder
          protocol: ftp # Use ftps if your server supports it for better security
          port: 21
